syntax = "proto3";

package mass.v1;

option go_package = "github.com/chinese-room-solutions/mass/rpc";

service Mass {
    // --- Inference ---
    rpc ChatCompletion(ChatCompletionRequest) returns (ChatCompletionResponse) {}
    rpc BatchChatCompletion(BatchChatCompletionRequest) returns (BatchChatCompletionResponse) {}
    rpc Embedding(EmbeddingRequest) returns (EmbeddingResponse) {}
    rpc BatchEmbedding(BatchEmbeddingRequest) returns (BatchEmbeddingResponse) {}
    rpc Tokenize(TokenizeRequest) returns (TokenizeResponse) {}

    // --- Async queue ---
    rpc SubmitRequest(SubmitRequestRequest) returns (SubmitRequestResponse) {}
    rpc GetResult(GetResultRequest) returns (GetResultResponse) {}

    // --- Model management ---
    rpc ListModels(ListModelsRequest) returns (ListModelsResponse) {}
    rpc LoadModel(LoadModelRequest) returns (LoadModelResponse) {}
    rpc DownloadModel(DownloadModelRequest) returns (DownloadModelResponse) {}

    // --- Hardware ---
    rpc RunBenchmark(RunBenchmarkRequest) returns (RunBenchmarkResponse) {}

    // --- Scheduling ---
    rpc SetDeviceEnabled(SetDeviceEnabledRequest) returns (SetDeviceEnabledResponse) {}
}

// ChatModelConfig specifies which inference backend and model to use for chat/completion.
message ChatModelConfig {
    oneof config {
        LlamaChatConfig llama = 1;
        // Future backends:
        // APIChatConfig openai = 2;
    }
}

// EmbeddingModelConfig specifies which inference backend and model to use for embeddings.
message EmbeddingModelConfig {
    oneof config {
        LlamaEmbeddingConfig llama = 1;
        // Future backends:
        // APIEmbeddingConfig openai = 2;
    }
}

// LlamaChatConfig configures a local llama.cpp chat model instance (GGUF format).
message LlamaChatConfig {
    string model = 1;           // GGUF file path (required)
    int32 context_size = 2;     // Context window size (0 = model default)
    int32 batch_size = 3;       // Batch size (0 = auto)
    int32 gpu_layers = 4;       // GPU layer offload count (0 = auto)
    string flash_attn = 5;      // "enabled", "disabled", or "" (auto)
    int32 threads = 6;          // CPU threads (0 = auto)
    int32 max_concurrent = 7;   // Max parallel contexts (0 = 1)
    bool thinking = 8;          // Enable reasoning/thinking mode
    string main_gpu = 9;        // Main GPU device
    string tensor_split = 10;   // Multi-GPU tensor split config
    string mmproj = 11;         // Vision projector GGUF path (enables vision/multimodal)
    string chat_template = 12;  // Override chat template (e.g. "vicuna" for LLaVA models)
    string cache_type = 13;     // KV cache quantization: "f16", "q8_0", "q4_0" (default: "q8_0")
}

// LlamaEmbeddingConfig configures a local llama.cpp embedding model instance (GGUF format).
message LlamaEmbeddingConfig {
    string model = 1;           // GGUF file path (required)
    int32 context_size = 2;     // Context window size (0 = model default)
    int32 gpu_layers = 3;       // GPU layer offload count (0 = auto)
    int32 threads = 4;          // CPU threads (0 = auto)
    int32 max_concurrent = 5;   // Max parallel contexts (0 = 1)
    string main_gpu = 6;        // Main GPU device
    string tensor_split = 7;    // Multi-GPU tensor split config
}

message ChatMessage {
    string role = 1;
    string content = 2;
    repeated ContentPart parts = 3; // Multipart content (takes precedence over content when non-empty)
}

// ContentPart represents a single part of a multipart message.
// Supported type values: "text", "image", "audio", "file".
message ContentPart {
    string type = 1;     // Media type: "text", "image", "audio", or "file"
    string text = 2;     // Text content (for type "text")
    bytes data = 3;      // Raw media bytes (for "image", "audio", "file")
    string filename = 4; // Original filename with extension (for "file")
}

message ChatCompletionRequest {
    string model = 1;
    repeated ChatMessage messages = 2;
    int32 max_tokens = 3;
    float temperature = 4;      // Sampling temperature (0 = greedy/deterministic)
    float top_p = 5;            // Nucleus sampling threshold
    int32 top_k = 6;            // Top-K sampling
    int32 seed = 7;             // Random seed for reproducible output (0 = random)
    repeated string stop = 8;   // Stop sequences
    float min_p = 9;            // Minimum probability threshold
    float repeat_penalty = 10;  // Repeat penalty multiplier (1.0 = disabled)
    float frequency_penalty = 11; // Frequency-based penalty (0.0 = disabled)
    float presence_penalty = 12;  // Presence-based penalty (0.0 = disabled)
    bool enable_thinking = 13;  // Enable reasoning/thinking extraction
    ChatModelConfig model_config = 14; // Full model config (takes precedence over model field)
    bool stream = 15;           // If true, response is streamed as SSE (text/event-stream)
}

message ChatCompletionResponse {
    string id = 1;
    string model = 2;
    ChatMessage message = 3;
    string finish_reason = 4;
    string reasoning_content = 5; // Extracted reasoning/thinking content
    Usage usage = 6;              // Token usage statistics
}

message Usage {
    int32 prompt_tokens = 1;
    int32 completion_tokens = 2;
    int32 total_tokens = 3;
    double tokens_per_second = 4; // Generation speed (completion tokens / eval time)
}

message BatchChatCompletionRequest {
    repeated ChatCompletionRequest requests = 1;
}

message BatchChatCompletionResponse {
    repeated ChatCompletionResponse responses = 1;
}

message EmbeddingRequest {
    string model = 1;
    string input = 2;
    EmbeddingModelConfig model_config = 3;
}

message EmbeddingResponse {
    string id = 1;
    string model = 2;
    repeated float embedding = 3;
}

message BatchEmbeddingRequest {
    string model = 1;
    repeated string inputs = 2;
    EmbeddingModelConfig model_config = 3;
}

message BatchEmbeddingResponse {
    string id = 1;
    string model = 2;
    repeated EmbeddingData embeddings = 3;
}

message EmbeddingData {
    int32 index = 1;
    repeated float embedding = 2;
}

message TokenizeRequest {
    string model = 1;
    string text = 2;
    ChatModelConfig model_config = 3;
}

message TokenizeResponse {
    repeated int32 tokens = 1;
}

// --- Async queue operations ---

message SubmitRequestRequest {
    oneof request {
        ChatCompletionRequest chat_completion = 1;
        BatchChatCompletionRequest batch_chat_completion = 2;
        EmbeddingRequest embedding = 3;
        BatchEmbeddingRequest batch_embedding = 4;
        TokenizeRequest tokenize = 5;
    }
    int32 priority = 6; // 0=background, 1=API (default), 2=module
    reserved 7; // Removed: skip_cache / cache
}

message SubmitRequestResponse {
    string request_id = 1;
    string request_hash = 2;  // for cache lookups
}

message GetResultRequest {
    string request_id = 1;
    bool wait = 2;            // if true, block until result is ready
}

message GetResultResponse {
    string status = 1;        // "pending", "processing", "done", "error"
    bytes body = 2;           // serialized proto response (when status=done)
    string error = 3;         // error message (when status=error)
}

// --- Model management ---

message ListModelsRequest {
    string type = 1;           // "chat" or "embedding" (empty = all)
    string search = 2;         // Free text search
    bool include_status = 3;   // Include runtime status from scheduler
}

message ListModelsResponse {
    repeated ModelInfo models = 1;
}

message ModelInfo {
    string id = 1;             // e.g. "publisher/repo/file.gguf"
    string type = 2;           // "chat" or "embedding"
    int64 size_bytes = 3;
    string quantization = 4;
    ModelCapabilities capabilities = 5;
    ModelStatus status = 6;    // Only populated when include_status=true
}

message ModelCapabilities {
    bool vision = 1;
    bool thinking = 2;
}

message ModelStatus {
    bool loaded = 1;
    int64 active_requests = 2;
    string mode = 3;
    string source = 4;
}

message LoadModelRequest {
    string path = 1;           // Model file path or ID
    string type = 2;           // "chat" or "embedding"
    int32 context_size = 3;
    int32 batch_size = 4;
    int32 gpu_layers = 5;
    int32 threads = 6;
    int32 max_concurrent = 7;
    int32 max_tokens = 8;
    string flash_attn = 9;     // "enabled", "disabled", or "" (auto)
    string main_gpu = 10;
    string tensor_split = 11;
    bool thinking = 12;
    string mmproj_path = 13;   // Vision projector path
    string chat_template = 14;
    string cache_type = 15;
}

message LoadModelResponse {
    string fingerprint = 1;
}

message DownloadModelRequest {
    string repo_id = 1;       // HuggingFace repo ID (e.g. "TheBloke/Llama-2-7B-GGUF")
    string filename = 2;      // Filename to download (e.g. "llama-2-7b.Q4_K_M.gguf")
}

message DownloadModelResponse {}

// --- Hardware ---

message RunBenchmarkRequest {
    repeated string agent_ids = 1;  // Empty = all online agents
    repeated string device_ids = 2; // Empty = all devices
}

message RunBenchmarkResponse {
    repeated BenchmarkResult results = 1;
}

message BenchmarkResult {
    string agent_id = 1;
    string device_id = 2;
    string device_name = 3;
    double memory_gbs = 4;
    double compute_gflops = 5;
    string error = 6;
}

// --- Scheduling ---

message SetDeviceEnabledRequest {
    string queue_name = 1; // Device queue name (e.g. "device:local:gpu:0")
    bool enabled = 2;
}

message SetDeviceEnabledResponse {
    int32 drained_tasks = 1; // Number of tasks moved back to global queue (when disabling)
}
