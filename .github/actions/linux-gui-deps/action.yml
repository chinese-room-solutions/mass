name: Linux GUI deps
description: >
  Install the GTK3 + WebKitGTK 4.1 dev packages the cgo GUI build needs, and
  verify pkg-config resolves them. Needed by every Linux job that loads the
  package graph — build, test, lint, and govulncheck all type-check the cgo
  webview packages, which have no pure-Go fallback.

runs:
  using: composite
  steps:
    - shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # DPkg::Lock::Timeout bounds the wait for the lock: the runner images run
        # a background apt timer, and plain apt-get retries a held lock forever —
        # which presents as a step that hangs for the entire job instead of
        # failing. Callers pair this with a step timeout-minutes (composite steps
        # cannot set their own). The seconds bound goes through timeout(1), which
        # is a binary and so must wrap apt-get itself rather than a shell function
        # around it, and must run under sudo to signal what it started.
        aptget() { local secs="$1"; shift; sudo timeout "$secs" apt-get -o DPkg::Lock::Timeout=180 "$@"; }

        # webkit2gtk pulls ~200 MB of hard dependencies, and the runner's default
        # mirror (azure.archive.ubuntu.com) intermittently serves them at a few
        # kB/s. That is not an apt error — it is a download that simply doesn't
        # finish, so unbounded it burns the caller's whole timeout and the step is
        # killed mid-transfer with nothing left to retry. Bounded, it becomes a
        # failure we can act on: fall back to the generic archive, a different
        # CDN, and try once more inside the same budget.
        install_deps() {
          aptget 120 update || return 1
          aptget 240 install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
        }
        if ! install_deps; then
          echo "::warning::apt was too slow on the default mirror; retrying on archive.ubuntu.com"
          sudo sed -i 's|https\?://[a-z0-9.-]*archive\.ubuntu\.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          install_deps
        fi

        # Assert the modules resolve here, where they are provisioned: Ubuntu's
        # pkg-config is pkgconf, which exits 1 with NO message on a missing
        # module, so a half-provisioned runner otherwise surfaces as an
        # unexplained exit 1 in whichever step queries it first.
        pkg-config --print-errors --exists gtk+-3.0 webkit2gtk-4.1
        # Some cgo deps still request the retired webkit2gtk-4.0 module. Alias
        # the .pc files, in the dir where the 4.1 ones actually live (they are
        # API-compatible), so those resolve too.
        pcdir=$(pkg-config --variable=pcfiledir webkit2gtk-4.1)
        sudo ln -sf "$pcdir/webkit2gtk-4.1.pc" "$pcdir/webkit2gtk-4.0.pc"
        sudo ln -sf "$pcdir/javascriptcoregtk-4.1.pc" "$pcdir/javascriptcoregtk-4.0.pc"
