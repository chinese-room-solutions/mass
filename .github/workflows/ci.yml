name: ci

# MASS is a pure-Go scheduler/UI/API; the only CGO is the native GUI on
# Linux/macOS (webview_go). CI runs on Linux alone — Windows and macOS runners
# are billed at 2x and 10x, so the other platforms are compiled by release.yml,
# which builds all three. Cross-repo deps (mass-sdk, mass-proto) are private —
# fetched via GH_PAT.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPRIVATE: github.com/chinese-room-solutions/*

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Configure private module access
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
      - name: Install Linux GUI deps
        # Bounded, so a stuck apt fails the step in minutes instead of hanging
        # the job. Covers the action's own 180s lock wait twice over.
        timeout-minutes: 8
        uses: ./.github/actions/linux-gui-deps
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web deps
        working-directory: web
        run: npm ci
      # make build runs build-web first: templ generate, stage the sdk theme
      # from the pinned Go module cache (no sibling checkout), and build the
      # CSS — failing if dist.css comes out empty.
      - name: Build
        run: make build

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Configure private module access
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
      - name: Install Linux GUI deps
        # Bounded, so a stuck apt fails the step in minutes instead of hanging
        # the job. Covers the action's own 180s lock wait twice over.
        timeout-minutes: 8
        uses: ./.github/actions/linux-gui-deps
      # make test needs no web assets: the embedded public/ dir compiles
      # without dist.css and the auth tests stub the file handler.
      - name: Test
        run: make test

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Configure private module access
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
      - name: Install Linux GUI deps
        # Bounded, so a stuck apt fails the step in minutes instead of hanging
        # the job. Covers the action's own 180s lock wait twice over.
        timeout-minutes: 8
        uses: ./.github/actions/linux-gui-deps
      # Build golangci-lint from source with this repo's Go (via `make lint`)
      # rather than golangci-lint-action's prebuilt binary — the prebuilt one is
      # compiled with an older Go and refuses to analyze a newer-Go module.
      - name: Lint
        run: make lint

  vulncheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Configure private module access
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
      - name: Install Linux GUI deps
        # Bounded, so a stuck apt fails the step in minutes instead of hanging
        # the job. Covers the action's own 180s lock wait twice over.
        timeout-minutes: 8
        uses: ./.github/actions/linux-gui-deps
      # Run govulncheck against the Go + module/build cache that setup-go already
      # warmed, instead of golang/govulncheck-action (which installs its own Go
      # and recompiles the whole CGO tree cold — ~18m).
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
