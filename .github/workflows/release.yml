name: release

# On a version tag (or manual dispatch), build the mass binary natively on each
# target OS and attach the archives to a single GitHub Release.
#
# MASS is pure Go except the native GUI (webview_go, CGO on Linux/macOS), so each
# artifact is built on its own runner — Linux needs the GTK/WebKit dev headers;
# Windows builds CGO-free (pure-Go webview2, no extra DLLs to ship). Every OS
# builds through `make build`. This is the only place the (10x-billed) macOS
# runner is used; CI covers Linux + Windows.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write  # upload release artifacts

env:
  GOPRIVATE: github.com/chinese-room-solutions/*

jobs:
  build:
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `asset` is the release-asset basename: mass_<goos>_<goarch>, no
        # version — stable names keep releases/latest/download/ links evergreen
        # (the website and READMEs hardcode them).
        # `setup_asset` is the stable name of the RAW installer binary (the
        # self-extracting mass-setup, not the double-clickable container). The
        # self-update downloads it by that evergreen name and verifies it
        # against the release's SHA256SUMS, so it needs a container-free
        # executable asset. Windows has no container to strip (the console .exe
        # is already the raw installer), so it needs no entry.
        include:
          - os: ubuntu-24.04
            label: linux-amd64
            asset: mass_linux_amd64
            setup_asset: mass-setup_linux_amd64
          - os: windows-latest
            label: windows-amd64
            asset: mass_windows_amd64
          - os: macos-15
            label: macos-arm64
            asset: mass_darwin_arm64
            setup_asset: mass-setup_darwin_arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Configure private module access
        shell: bash
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        # Bounded, so a stuck apt fails the step in minutes instead of hanging
        # the job. Room for the action's own 300s + 600s transfer bounds.
        timeout-minutes: 17
        uses: ./.github/actions/linux-gui-deps
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web deps
        shell: bash
        working-directory: web
        run: npm ci
      # One stamp for the whole job. A release runs make twice (Build, then
      # Package installer), each re-deriving VERSION from `git describe`, so
      # anything the first invocation writes into a tracked file would stamp the
      # second one -dirty — the shipped binary, since `package` relinks it.
      # Pinning the tag makes the two agree by construction. Left unset on a
      # manual dispatch, where there is no tag and the Makefile's own derivation
      # is the honest answer.
      - name: Pin the version stamp to the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
      # make build/bundle-macos run build-web first: templ generate, stage the
      # sdk theme from the pinned Go module cache (no sibling checkout), and
      # build the CSS — failing if dist.css comes out empty.
      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            make bundle-macos  # .app bundle: launching from Finder opens no Terminal
          else
            make build
          fi
      # make package leaves the raw self-extracting installer beside the
      # double-clickable container; the Archive step below uploads it under the
      # stable name the self-update fetches.
      - name: Package installer
        shell: bash
        run: make package
      - name: Archive
        shell: bash
        run: |
          name="${{ matrix.asset }}"
          setup="mass-setup_${name#mass_}"
          # Stable name of the raw, container-free installer the self-update
          # downloads. Empty on Windows, whose .exe below is already
          # container-free.
          raw="${{ matrix.setup_asset }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$name.zip" ./bin/mass.exe
            mv dist/mass-setup.exe "$setup.exe"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            tar -czf "$name.tar.gz" -C bin MASS.app
            mv dist/MASS-Setup.zip "$setup.zip"
            mv dist/mass-setup "$raw"
          else
            tar -czf "$name.tar.gz" -C bin mass
            mv dist/*.AppImage "$setup.AppImage"
            mv dist/mass-setup "$raw"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: |
            mass_*.tar.gz
            mass_*.zip
            mass-setup_*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      # download-artifact nests each matrix leg in its own directory, so flatten
      # first and checksum exactly what gets uploaded. SHA256SUMS is what the
      # self-update verifies its downloaded installer against — without it the
      # updater refuses the asset.
      - name: Collect assets and checksum them
        run: |
          mkdir -p release
          find artifacts -type f \( -name 'mass_*' -o -name 'mass-setup_*' \) \
            -exec mv -t release {} +
          cd release
          sha256sum mass_* mass-setup_* > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
          # Missing assets are a failed release, not a partial one.
          fail_on_unmatched_files: true
