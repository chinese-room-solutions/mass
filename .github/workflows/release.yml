name: release

# On a version tag (or manual dispatch), build the mass binary natively on each
# target OS and attach the archives to a single GitHub Release.
#
# MASS is pure Go except the native GUI (webview_go, CGO on Linux/macOS), so each
# artifact is built on its own runner — Linux needs the GTK/WebKit dev headers;
# Windows builds CGO-free (pure-Go webview2, no extra DLLs to ship). Every OS
# builds through `make build`. This is the only place the (10x-billed) macOS
# runner is used; CI covers Linux + Windows.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write  # upload release artifacts

env:
  GOPRIVATE: github.com/chinese-room-solutions/*

jobs:
  build:
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `asset` is the release-asset basename: mass_<goos>_<goarch>, no
        # version — stable names keep releases/latest/download/ links evergreen
        # (the website and READMEs hardcode them).
        include:
          - os: ubuntu-24.04
            label: linux-amd64
            asset: mass_linux_amd64
          - os: windows-latest
            label: windows-amd64
            asset: mass_windows_amd64
          - os: macos-15
            label: macos-arm64
            asset: mass_darwin_arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Configure private module access
        shell: bash
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        # Bounded, so a stuck apt fails the step in minutes instead of hanging
        # the job. Covers the action's own 180s lock wait twice over.
        timeout-minutes: 8
        uses: ./.github/actions/linux-gui-deps
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web deps
        shell: bash
        working-directory: web
        run: npm ci
      # make build/bundle-macos run build-web first: templ generate, stage the
      # sdk theme from the pinned Go module cache (no sibling checkout), and
      # build the CSS — failing if dist.css comes out empty.
      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            make bundle-macos  # .app bundle: launching from Finder opens no Terminal
          else
            make build
          fi
      - name: Package installer
        shell: bash
        run: make package
      - name: Archive
        shell: bash
        run: |
          name="${{ matrix.asset }}"
          setup="mass-setup_${name#mass_}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$name.zip" ./bin/mass.exe
            mv dist/mass-setup.exe "$setup.exe"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            tar -czf "$name.tar.gz" -C bin MASS.app
            mv dist/MASS-Setup.zip "$setup.zip"
          else
            tar -czf "$name.tar.gz" -C bin mass
            mv dist/*.AppImage "$setup.AppImage"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: |
            mass_*.tar.gz
            mass_*.zip
            mass-setup_*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.AppImage
            artifacts/**/*.exe
          generate_release_notes: true
